name: Build Windows Installer

on:
  workflow_dispatch: # 支持在 GitHub 网页手动点击触发
  push:
    branches:
      - main
    tags:
      - 'v*' # 推送以 v 开头的 tag 时自动触发打包并发布 Release

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 发版时从 CHANGELOG.md 提取对应版本说明；缺失则在编译前直接失败，避免漏写更新说明
      - name: Extract Release Notes from CHANGELOG (On Tag Push)
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          ./.github/scripts/extract-release-notes.ps1 -Tag "$env:GITHUB_REF_NAME" -OutFile "$env:RUNNER_TEMP/release-notes.md"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install --no-audit --no-fund

      - name: Build CastFlow Manager (C# GUI)
        shell: powershell
        run: |
          Write-Host "Compiling CastFlowManager.exe..."
          powershell -ExecutionPolicy Bypass -File manager\build.ps1
          Copy-Item manager\CastFlowManager.exe CastFlowManager.exe -Force
          Write-Host "CastFlowManager.exe compiled successfully."

      - name: Package CastFlow Runtime
        shell: powershell
        run: |
          Write-Host "Running build.ps1 to package CastFlow runtime..."
          powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Install Inno Setup
        shell: powershell
        run: |
          Write-Host "Installing Inno Setup via Chocolatey..."
          choco install innosetup -y --no-progress
          $innoDir = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $innoDir) {
            Write-Host "Adding $innoDir to GITHUB_PATH"
            "$innoDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Compile Installer with Inno Setup
        shell: powershell
        run: |
          Write-Host "Compiling installer.iss..."
          $iscc = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) {
            throw "Inno Setup compiler (iscc.exe) not found!"
          }
          & $iscc installer.iss
          Write-Host "Installer compiled successfully."

      - name: Create Portable Zip Package
        shell: powershell
        run: |
          Write-Host "Creating portable zip package..."
          Compress-Archive -Path dist\CastFlow\* -DestinationPath dist\CastFlow-Portable.zip -Force
          Write-Host "Portable package created at dist\CastFlow-Portable.zip"

      # 生成 sha256sum 格式的校验文件，管理器在线更新时据此校验安装包
      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Name -like '*Setup*.exe' -or $_.Name -eq 'CastFlow-Portable.zip' })
          if ($files.Count -lt 2) { throw "未找到完整的安装包与便携包，无法生成校验文件" }
          $lines = $files | Sort-Object Name | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/SHA256SUMS.txt'), ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          Get-Content dist/SHA256SUMS.txt

      - name: Upload Installer to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CastFlow-Windows-Installer
          path: |
            dist/*Setup*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload Portable Zip to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CastFlow-Portable-Zip
          path: dist/CastFlow-Portable.zip
          if-no-files-found: error

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/*Setup*.exe
            dist/CastFlow-Portable.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true # 在 CHANGELOG 说明后追加自动生成的版本对比链接
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
